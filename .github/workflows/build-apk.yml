
name: Build Mikasa PS2

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Fetch Play! emulator source
        run: git clone --depth 1 --recurse-submodules https://github.com/jpd002/Play-.git upstream-play

      - name: Build Android APK
        working-directory: upstream-play/build_android
        run: |
          chmod +x gradlew
          sdkmanager "platform-tools" "platforms;android-35" "ndk;27.2.12479018"
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon assembleDebug

      - name: Collect APK
        run: |
          mkdir -p dist
          APK="$(find upstream-play/build_android -type f -name '*.apk' -path '*/build/outputs/apk/*' | head -n 1)"
          test -n "$APK" || { echo "APK not found"; exit 1; }
          cp "$APK" dist/MikasaPS2-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MikasaPS2-Android-APK
          path: dist/MikasaPS2-debug.apk
